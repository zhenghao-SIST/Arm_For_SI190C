# ros_gz_bridge configuration
# Maps between ROS 2 topics and Gazebo Transport topics

# --- Camera (GZ → ROS) ---
- ros_topic_name: "/camera_sensor"
  gz_topic_name: "/camera_sensor"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera_info"
  gz_topic_name: "/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# --- Joint position commands (ROS → GZ) ---
# JointPositionController listens on /model/<model>/joint/<joint>/0/cmd_pos
- ros_topic_name: "/base_to_link0/cmd_pos"
  gz_topic_name: "/model/my/joint/base_to_link0/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/link0_to_link1/cmd_pos"
  gz_topic_name: "/model/my/joint/link0_to_link1/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/link1_to_link2/cmd_pos"
  gz_topic_name: "/model/my/joint/link1_to_link2/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/link2_to_link3/cmd_pos"
  gz_topic_name: "/model/my/joint/link2_to_link3/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/link3_to_link4/cmd_pos"
  gz_topic_name: "/model/my/joint/link3_to_link4/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/link4_to_link5/cmd_pos"
  gz_topic_name: "/model/my/joint/link4_to_link5/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
